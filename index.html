<style>
:root {
  --bg: #13231f;
  --bg-deep: #081310;
  --sand: #f4e6c3;
  --sand-soft: #cbbd9c;
  --clay: #d27a35;
  --clay-light: #f0a45e;
  --glass: rgba(255, 255, 255, .095);
  --glass-strong: rgba(255, 255, 255, .14);
  --line: rgba(255, 255, 255, .2);
  --text: #fff9ea;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: inherit; }

body {
  position: relative;
  isolation: isolate;
  min-height: 100%;
  margin: 0;
  overflow-x: hidden;
  font-family: Outfit, system-ui, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 12% 12%, rgba(210, 122, 53, .28), transparent 28%),
    radial-gradient(circle at 88% 78%, rgba(91, 157, 133, .22), transparent 30%),
    linear-gradient(145deg, var(--bg) 0%, #1b352c 46%, var(--bg-deep) 100%);
  display: flex;
  justify-content: center;
}

body::before,
body::after {
  position: fixed;
  z-index: -1;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  content: "";
  filter: blur(12px);
  opacity: .6;
  pointer-events: none;
}

body::before {
  top: -90px;
  right: -80px;
  background: rgba(239, 165, 94, .18);
}

body::after {
  bottom: -110px;
  left: -90px;
  background: rgba(109, 185, 155, .16);
}

main {
  position: relative;
  width: min(100%, 470px);
  min-height: 100vh;
  padding: 24px 20px 38px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

main::before {
  position: absolute;
  z-index: -1;
  inset: 12px 10px;
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 34px;
  background: linear-gradient(145deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .018));
  box-shadow: 0 28px 90px rgba(0, 0, 0, .3), inset 0 1px rgba(255, 255, 255, .09);
  content: "";
  pointer-events: none;
}

.lang {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(0, 0, 0, .16);
  box-shadow: inset 0 1px rgba(255, 255, 255, .08), 0 8px 24px rgba(0, 0, 0, .12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.lang button {
  border: 0;
  border-radius: 999px;
  padding: 7px 16px;
  color: var(--sand-soft);
  background: transparent;
  font: 600 .85rem Outfit, sans-serif;
  cursor: pointer;
  transition: color .2s ease, background .2s ease, transform .2s ease;
}

.lang button:hover { transform: translateY(-1px); color: var(--text); }
.lang button[aria-pressed="true"] { color: #1d2a22; background: var(--sand); }

.logo {
  width: min(62vw, 230px);
  height: auto;
  margin: 32px 0 20px;
  border: 7px solid rgba(244, 230, 195, .12);
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .24), 0 20px 50px rgba(0, 0, 0, .5);
}

h1 {
  margin: 0;
  color: var(--sand);
  text-align: center;
  font: 800 2.35rem/1 Fraunces, Georgia, serif;
  letter-spacing: .01em;
  text-shadow: 0 3px 18px rgba(0, 0, 0, .28);
}

.tag {
  max-width: 30ch;
  margin: 11px 0 30px;
  color: var(--sand-soft);
  text-align: center;
  font-size: 1rem;
  line-height: 1.55;
}

.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding: 0;
  margin: 0;
  list-style: none;
}

.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  overflow: hidden;
  padding: 15px 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  color: var(--text);
  background: linear-gradient(120deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .045));
  box-shadow: 0 12px 28px rgba(0, 0, 0, .16), inset 0 1px rgba(255, 255, 255, .14);
  text-decoration: none;
  font-size: 1.05rem;
  font-weight: 500;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
}

.btn::after {
  position: absolute;
  top: -80%;
  left: -30%;
  width: 45%;
  height: 260%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .14), transparent);
  content: "";
  transform: rotate(24deg) translateX(-180%);
  transition: transform .55s ease;
  pointer-events: none;
}

.btn:hover {
  border-color: rgba(240, 164, 94, .72);
  background: linear-gradient(120deg, rgba(255, 255, 255, .19), rgba(255, 255, 255, .07));
  box-shadow: 0 16px 32px rgba(0, 0, 0, .24), 0 0 0 3px rgba(210, 122, 53, .08);
  transform: translateY(-3px);
}

.btn:hover::after { transform: rotate(24deg) translateX(520%); }
.btn:focus-visible, .lang button:focus-visible { outline: 3px solid var(--sand); outline-offset: 3px; }

.ico {
  flex: none;
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .22);
  border-radius: 13px;
  background: linear-gradient(145deg, var(--clay-light), var(--clay));
  box-shadow: inset 0 1px rgba(255, 255, 255, .25), 0 6px 15px rgba(0, 0, 0, .16);
}

.ico svg { width: 24px; height: 24px; fill: #fff; }
.txt { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.txt small { color: var(--sand-soft); font-size: .82rem; font-weight: 400; }
.arrow { width: 18px; height: 18px; fill: none; stroke: var(--sand-soft); stroke-width: 2; transition: transform .2s ease; }
.btn:hover .arrow { transform: translateX(3px); }
[dir="rtl"] .arrow { transform: scaleX(-1); }
[dir="rtl"] .btn:hover .arrow { transform: scaleX(-1) translateX(3px); }
.btn.wa .ico { background: linear-gradient(145deg, #48c77b, #15924e); }

footer { margin-top: 32px; color: var(--sand-soft); font-size: .8rem; opacity: .85; }

@media (max-width: 390px) {
  main { padding-inline: 16px; }
  h1 { font-size: 2.1rem; }
  .btn { padding-inline: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
